# `mise run fmt` formats with this file, and `mise run check` checks with it.
excludes = [
  ".terraform.lock.hcl",
  # Generated by `mise lock`.
  ".mise/mise.lock",
  # Encrypted: sops rejects a file whose bytes changed.
  "secrets/**",
  "talos/secrets.sops.yaml",
  # Vendored unchanged, so an update replaces the whole file.
  "cluster/platform/manifests/storage/local-path-provisioner.yaml",
  # Go templates, which no YAML formatter parses.
  "cluster/platform/charts/*/templates/**",
]

[formatter.tofu]
command = "tofu"
options = ["fmt"]
includes = ["*.tf", "*.tfvars"]

[formatter.shell]
command = "shfmt"
options = ["--write", "--indent=2"]
includes = [".mise/tasks/*"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.yaml]
command = "dprint"
options = ["fmt", "--config", ".mise/dprint.json"]
includes = ["*.yaml", "*.yml"]

[formatter.markdown]
command = "rumdl"
options = ["fmt", "--config", ".mise/rumdl.toml"]
includes = ["*.md"]
