apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ncaleague-db
  namespace: ncaleague-prod
spec:
  # One instance: a second on the same node buys no availability, only memory.
  instances: 1
  priorityClassName: prod
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  postgresql:
    pg_hba:
      # Password auth over TLS only; no trust, no local shortcuts.
      - hostssl all all all scram-sha-256

  bootstrap:
    initdb:
      database: ncaleague
      owner: ncaleague

  resources:
    requests: { cpu: 50m, memory: 192Mi }

  storage:
    storageClass: local-data
    size: 2Gi

  # Continuous WAL archiving to object-store.yaml, for point-in-time restore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ncaleague-db
