apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ncaleague-db-nightly
  namespace: ncaleague-prod
spec:
  schedule: "0 0 3 * * *"
  # A base backup right after creation, so a new cluster is restorable before
  # its first night. WAL alone restores nothing.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: ncaleague-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
