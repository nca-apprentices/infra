# The Postgres cluster and its backup. Needs the CNPG operator, the Barman
# Cloud plugin, and storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ncaleague-prod-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ncaleague-prod
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: cluster/apps/ncaleague/prod/manifests/database
  destination:
    server: https://kubernetes.default.svc
    namespace: ncaleague-prod
  # The database ApplicationSet takes these resources over. Without automated
  # sync, this Application can't prune them meanwhile.
  syncPolicy:
    syncOptions: [ServerSideApply=true]
