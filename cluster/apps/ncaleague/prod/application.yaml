# The app from its released chart. Deploying is changing targetRevision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ncaleague-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ncaleague-prod
  source:
    repoURL: oci://ghcr.io/nca-apprentices/charts/ncaleague
    targetRevision: 2.0.2
    path: .
    helm:
      valuesObject:
        priorityClassName: prod
        # Memory requested and limited alike, so only its own limit can end a
        # pod.
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 256Mi }
        ingress:
          host: ncaleague.nca-apprentices.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ncaleague-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
