# Requests every container gets unless it sets its own, so the quota can count
# them. Prod sets no default limit: its pods run at priority prod, and the node
# evicts dev first under memory pressure.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ncaleague-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ncaleague-prod
  namespace: ncaleague-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # The app and its database request about 120m and 310 MiB. The quotas of all
  # environments together stay under 1.5 times the node, where the
  # KubeCPUQuotaOvercommit and KubeMemoryQuotaOvercommit alerts fire.
  hard:
    requests.cpu: 300m
    requests.memory: 512Mi
