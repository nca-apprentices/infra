# Requests every container gets unless it sets its own, so the quota can count
# them. Prod sets no default limit: its pods run at priority prod, and the node
# evicts dev first under memory pressure.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ncaleague-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ncaleague-prod
  namespace: ncaleague-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # The app, its database, and a backup or restore pod beside them.
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
