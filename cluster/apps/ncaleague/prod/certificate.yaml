# The certificate the chart's Ingress names in ingress.tls.secretName. The host
# repeats ingress.host from application.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ncaleague-tls
  namespace: ncaleague-prod
spec:
  secretName: ncaleague-tls
  dnsNames: [ncaleague.nca-apprentices.dev]
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
