apiVersion: v1
kind: Namespace
metadata:
  name: ncaleague-dev
  # The API server rejects any pod that could run as root, escalate its
  # privileges, keep a capability, or run without seccomp.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    # Denies all traffic until the network chart's policies allow it, see
    # platform/manifests/policies/environments.yaml.
    nca-apprentices.dev/environment: dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
