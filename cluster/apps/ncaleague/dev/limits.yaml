# What a container gets when it sets nothing. Dev may use twice what it
# requests, and goes first when memory runs short, as it has no priority
# class. CPU has no limit: a busy pod slows down instead of dying.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ncaleague-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      default: { memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 256Mi }
