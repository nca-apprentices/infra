# Requests every container gets unless it sets its own, so the quota can count
# them. The default limit stops a leak in dev from taking memory prod needs.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ncaleague-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ncaleague-dev
  namespace: ncaleague-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Room for the app and its database, as in prod, and no more: see the
  # quota in ../prod/limits.yaml.
  hard:
    requests.cpu: 200m
    requests.memory: 384Mi
