# The app from its released chart. Deploying is changing targetRevision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ncaleague-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ncaleague-dev
  source:
    repoURL: oci://ghcr.io/nca-apprentices/charts/ncaleague
    targetRevision: 2.0.2
    path: .
    helm:
      valuesObject:
        # Half of prod's request, with prod's limit.
        backend:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
        ingress:
          host: ncaleague-dev.nca-apprentices.dev
          middlewares: [github-login]
  destination:
    server: https://kubernetes.default.svc
    namespace: ncaleague-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
