# The GitHub login, for members of nca-apprentices only. The chart's Ingress
# names it in ingress.middlewares, see application.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-login
  namespace: ncaleague-dev
spec:
  forwardAuth:
    address: http://oauth2-proxy-apps.ops.svc.cluster.local/
    trustForwardHeader: true
