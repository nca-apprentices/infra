# Ingress comes from this namespace and the platform only, never from another
# app or environment: a pod in one environment can't reach another's database.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolate
  namespace: ncaleague-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Every pod but the database's, which the policy below admits. A pod no
  # policy selects admits everyone, so the two selectors must cover each pod.
  endpointSelector:
    matchExpressions:
      - { key: cnpg.io/cluster, operator: DoesNotExist }
  ingress:
    - fromEndpoints:
        - {}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
---
# The database admits the backend on the Postgres port only, so the other pods
# in the namespace can't reach it. The operator, the metrics scrape, and the
# database's own instances keep full access.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database
  namespace: ncaleague-dev
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  endpointSelector:
    matchExpressions:
      - { key: cnpg.io/cluster, operator: Exists }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/component: backend }
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - fromEndpoints:
        - matchExpressions:
            - { key: cnpg.io/cluster, operator: Exists }
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
