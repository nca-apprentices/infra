apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: jjforge-db
  namespace: jjforge-dev
spec:
  # One instance: a second on the same node buys no availability, only memory.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  postgresql:
    parameters:
      max_connections: "200"
    pg_hba:
      # Password auth over TLS only; no trust, no local shortcuts.
      - hostssl all all all scram-sha-256

  bootstrap:
    initdb:
      database: jjforge
      owner: jjforge

  storage:
    storageClass: local-data
    # Dev data is disposable, so it gets less space and no backup.
    size: 5Gi
