# The product itself, from the released chart. The cluster is just another
# installation of it -- if something cannot be expressed in the chart, it does
# not belong in the product. Deploying is changing targetRevision.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jjforge-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # A GitHub deployment in jjforge per release, see cluster/bootstrap/.
    notifications.argoproj.io/subscribe.deployment.github: ""
spec:
  project: jjforge-dev
  source:
    repoURL: oci://ghcr.io/nca-apprentices/charts/jjforge
    targetRevision: 0.4.0
    path: .
    helm:
      valuesObject:
        ingress:
          host: jjforge-dev.nca-apprentices.dev
          middlewares: [github-login, no-cookies]
        # Half of prod's requests, with prod's limits.
        server:
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          # The app secret of database/values.yaml's cluster. A chart without
          # it ignores it.
          database: { secretName: jjforge-db-app }
        # Traces to the OpenTelemetry Collector of platform/telemetry.yaml,
        # as jjforge's ADR 0005 decides. A chart without them ignores them.
        telemetry:
          tracesEndpoint: http://telemetry.observability.svc:4318/v1/traces
          environment: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: jjforge-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
