# Pod Security restricted, tried in dev before prod. Every container runs as
# Redpanda's user 101, the sidecar and init containers included.
container: &container
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
podSecurity: &pod
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile: { type: RuntimeDefault }
statefulset:
  podTemplate:
    spec:
      securityContext: *pod
      initContainers:
        - { name: redpanda-configurator, securityContext: *container }
        - { name: bootstrap-yaml-envsubst, securityContext: *container }
      containers:
        - { name: redpanda, securityContext: *container }
        - { name: sidecar, securityContext: *container }
post_install_job:
  podTemplate:
    spec:
      securityContext: *pod
      initContainers:
        - { name: bootstrap-yaml-envsubst, securityContext: *container }
      containers:
        - { name: post-install, securityContext: *container }
# Dev data is disposable, so it gets a fifth of a core, less memory and space,
# and no backup. Developer mode lets Redpanda start below the 1 GiB that
# production mode demands. Without traffic it runs in 448 MiB.
config: { node: { developer_mode: true } }
resources:
  cpu: { cores: 200m }
  memory:
    container: { min: 512Mi, max: 1Gi }
    redpanda: { memory: 448Mi, reserveMemory: 0Mi }
storage: { persistentVolume: { size: 5Gi } }
# Served at ops.nca-apprentices.dev/jjforge-dev/redpanda behind the GitHub
# login. Everyone who passes it may read and delete topics. The schema
# rejects the chart's empty className and targetPort.
console:
  enabled: true
  console: { config: { server: { basePath: /jjforge-dev/redpanda } } }
  service: { targetPort: 8080 }
  ingress: { className: "" }
  resources: { requests: { cpu: 10m, memory: 64Mi } }
  # The console keeps its image's user, which the chart already sets.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  securityContext: *container
