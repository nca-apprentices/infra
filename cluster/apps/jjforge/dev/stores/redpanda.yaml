# Dev data is disposable, so it gets a fifth of a core, less memory and space,
# and no backup. Developer mode lets Redpanda start below the 1 GiB that
# production mode demands. Without traffic it runs in 448 MiB.
config: { node: { developer_mode: true } }
resources:
  cpu: { cores: 200m }
  memory:
    container: { min: 512Mi, max: 1Gi }
    redpanda: { memory: 448Mi, reserveMemory: 0Mi }
storage: { persistentVolume: { size: 5Gi } }
# Served at redpanda-dev.nca-apprentices.dev behind the GitHub login. Everyone
# who passes it may read and delete topics. The schema rejects the chart's
# empty className and targetPort.
console:
  enabled: true
  service: { targetPort: 8080 }
  ingress: { className: "" }
  resources: { requests: { cpu: 10m, memory: 64Mi } }
  # Pod Security restricted, as the image's user, which the chart already
  # sets.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
