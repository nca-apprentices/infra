# Dev data is disposable, so it gets a fifth of a core, less memory and space,
# and no backup. Developer mode lets Redpanda start below the 1 GiB that
# production mode demands. Without traffic it runs in 448 MiB.
config: { node: { developer_mode: true } }
resources:
  cpu: { cores: 200m }
  memory:
    container: { min: 512Mi, max: 1Gi }
    redpanda: { memory: 448Mi, reserveMemory: 0Mi }
storage: { persistentVolume: { size: 5Gi } }
# The external listener takes fixed NodePorts, which prod holds.
external: { enabled: false }
