# What jjforge-dev's Applications may deploy: its chart, its stores' charts,
# its directory here, and the chart of a PR's head commit for a preview, into
# its own namespace and the previews' jjforge-pr-<number> only. The namespaces
# come from this directory and ../preview/environment.yaml under the platform's
# project, so the app creates no cluster-scoped objects itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jjforge-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: jjforge, development
  sourceRepos:
    - oci://ghcr.io/nca-apprentices/charts/jjforge
    - https://github.com/nca-apprentices/jjforge.git
    - https://github.com/nca-apprentices/infra.git
    - https://charts.redpanda.com
    - https://seaweedfs.github.io/seaweedfs/helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jjforge-dev
    - server: https://kubernetes.default.svc
      namespace: jjforge-pr-*
  clusterResourceWhitelist: []
  # The platform's limits on the namespace, which its own Application applies.
  # A chart that shipped one could lift them.
  namespaceResourceBlacklist:
    - { group: cilium.io, kind: "*" }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: "", kind: LimitRange }
    # An IngressRoute's host is a string in its rule, which the ingress-hosts
    # admission policy can't check. Apps serve through an Ingress instead.
    - { group: traefik.io, kind: "IngressRoute*" }
    # The secrets Application alone creates SopsSecrets, see
    # cluster/platform/manifests/policies/sops.yaml.
    - { group: isindir.github.com, kind: SopsSecret }
