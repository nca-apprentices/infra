# The Postgres cluster of jjforge-dev, from cluster/platform/charts/database.
name: jjforge
# Dev data is disposable, so it gets less space and no backup.
size: 5Gi
parameters: { max_connections: 200 }
# Half of prod's request, with prod's limit.
resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 512Mi }
