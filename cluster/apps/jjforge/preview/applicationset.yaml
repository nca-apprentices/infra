# One Application per open jjforge PR with the preview label, named
# jjforge-pr-<number> and served at jjforge-pr-<number>.nca-apprentices.dev
# behind the GitHub login. It runs the chart and images of the PR's head commit
# in a namespace of its own, see environment.yaml, so the PR's code reaches no
# Secret of dev.
# jjforge's CI pushes the images, tagged with the commit. Its database comes
# from environment.yaml, so its migrations never touch dev's.
#
# Once the PR merges, closes, or loses the label, the generator drops the
# Application, and Argo CD deletes everything it deployed. Unlike the apps
# ApplicationSet, this one preserves nothing.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jjforge-preview
  namespace: argocd
  annotations:
    # The Argo CD diff on infra PRs lacks the App's key to list PRs.
    argocd-diff-preview/render: never
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: nca-apprentices
          repo: jjforge
          labels: [preview]
          # The GitHub App Argo CD reads this repository with. Anonymous
          # requests get 60 per hour.
          appSecretName: infra-repo
        # No webhook reaches Argo CD behind the GitHub login, so it polls.
        requeueAfterSeconds: 60
  template:
    metadata:
      name: "jjforge-pr-{{ .number }}"
      annotations:
        # A GitHub deployment per head commit, see cluster/bootstrap/.
        notifications.argoproj.io/subscribe.deployment.github: ""
    spec:
      project: "jjforge-pr-{{ .number }}"
      source:
        repoURL: https://github.com/nca-apprentices/jjforge.git
        targetRevision: "{{ .head_sha }}"
        path: shared/deploy/chart
        helm:
          valuesObject:
            # A preview requests little, may use what prod does, and goes
            # first when memory runs short.
            priorityClassName: preview
            server:
              image: { tag: "{{ .head_sha }}" }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 768Mi }
              database: { secretName: "jjforge-pr-{{ .number }}-db-app" }
            vcs:
              image: { tag: "{{ .head_sha }}" }
            ingress:
              host: "jjforge-pr-{{ .number }}.nca-apprentices.dev"
              middlewares: [github-login, no-cookies]
              # cert-manager issues the certificate from the Ingress and
              # deletes it, with its secret, along with the Ingress.
              tls:
                secretName: "jjforge-pr-{{ .number }}-tls"
                issuer: letsencrypt
            telemetry:
              tracesEndpoint: http://telemetry.observability.svc:4318/v1/traces
              environment: "pr-{{ .number }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "jjforge-pr-{{ .number }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
        # The migration Job fails until the preview's database accepts
        # connections, which takes a minute after the PR is labeled.
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
