# The Postgres cluster of each jjforge preview, jjforge-pr-<number>-db, from
# the chart in platform/charts/database. A preview migrates its own database,
# so a PR's migrations never reach dev's. It follows the same PRs as
# applicationset.yaml, and it goes, with its data, when the preview does.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jjforge-preview-database
  namespace: argocd
  annotations:
    # The Argo CD diff on infra PRs lacks the App's key to list PRs.
    argocd-diff-preview/render: never
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: nca-apprentices
          repo: jjforge
          labels: [preview]
          appSecretName: infra-repo
        requeueAfterSeconds: 60
  template:
    metadata:
      name: "jjforge-pr-{{ .number }}-postgres"
    spec:
      project: jjforge-dev
      source:
        repoURL: https://github.com/nca-apprentices/infra.git
        targetRevision: main
        path: cluster/platform/charts/database
        helm:
          releaseName: database
          valuesObject:
            name: "jjforge-pr-{{ .number }}"
            keep: false
            # A preview holds test data only. It requests as little as dev's
            # database uses, see infra#5.
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 256Mi }
      destination:
        server: https://kubernetes.default.svc
        namespace: jjforge-dev
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
