apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: jjforge-ci
spec:
  limits:
    - type: Container
      default: { cpu: "2", memory: 4Gi }
      defaultRequest: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-runners
  namespace: jjforge-ci
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    pods: "20"
