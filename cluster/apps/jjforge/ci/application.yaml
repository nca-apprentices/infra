# Network policy and resource limits for the runners that execute jjforge CI.
# One set serves jjforge-prod, the forge users push to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jjforge-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: jjforge-ci
  source:
    repoURL: git@github.com:nca-apprentices/infra.git
    targetRevision: main
    path: cluster/apps/jjforge/ci/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: jjforge-ci
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
