# What jjforge-ci's Applications may deploy: its directory here, into its own
# namespace only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jjforge-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: jjforge CI runners
  sourceRepos:
    - git@github.com:nca-apprentices/infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jjforge-ci
  clusterResourceWhitelist: []
