# The Redpanda and SeaweedFS backups, each writing to its own Hetzner bucket
# from tofu/backup.tf. Needs the stores.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jjforge-prod-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: jjforge-prod
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: cluster/apps/jjforge/prod/manifests/backup
  destination:
    server: https://kubernetes.default.svc
    namespace: jjforge-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
