# The Redpanda and SeaweedFS backups, each writing to its own Hetzner bucket
# from tofu/backup.tf. Needs the stores.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jjforge-prod-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # The server-side diff dry-runs the new Job template, which Kubernetes
    # rejects as immutable before ignoreDifferences can apply.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  project: jjforge-prod
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: cluster/apps/jjforge/prod/manifests/backup
  destination:
    server: https://kubernetes.default.svc
    namespace: jjforge-prod
  # The restore Jobs run once per cluster, and a Job's template can't change
  # after it's created. Without this, an image update to either Job fails
  # every sync, and the backups' own updates never reach the cluster.
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers: [/spec/template]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
