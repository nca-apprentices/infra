# Half a core is enough while traffic is low. Redpanda gets 80% of the
# memory request, and production mode refuses to start below 1 GiB.
statefulset: { priorityClassName: prod }
resources:
  cpu: { cores: 500m }
  memory: { container: { min: 1.3Gi, max: 1.5Gi } }
storage: { persistentVolume: { size: 50Gi } }
