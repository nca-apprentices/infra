# Mirrors every bucket in SeaweedFS to its Hetzner bucket as changes happen.
# The filer stores how far the mirror got, so a restart resumes there. Deletes
# reach the mirror too, and bucket versioning keeps what they removed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-backup
  namespace: jjforge-prod
data:
  replication.toml: |
    [sink.s3]
    enabled = true
    endpoint = "https://fsn1.your-objectstorage.com"
    region = "fsn1"
    bucket = "nca-backup-jjforge-prod-seaweedfs"
    directory = "/"
    is_incremental = false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-backup
  namespace: jjforge-prod
spec:
  replicas: 1
  # Two mirrors would race on the same position.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: seaweedfs-backup }
  template:
    metadata:
      labels: { app: seaweedfs-backup }
    spec:
      priorityClassName: prod
      # Pod Security restricted, as the image's seaweed user. The mirror keeps
      # its position in the filer, not on disk.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: filer-backup
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          args:
            - filer.backup
            - -filer=seaweedfs-filer:8888
            - -filerPath=/buckets
            - -doDeleteFiles
          # The S3 sink falls back to the AWS environment variables.
          envFrom:
            - secretRef: { name: seaweedfs-backup-s3 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: config
          configMap: { name: seaweedfs-backup }
