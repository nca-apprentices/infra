# What jjforge-prod's Applications may deploy: its chart, its stores' charts,
# and its directory here, into its own namespace only. The namespace comes
# from this directory under the platform's project, so the app creates no
# cluster-scoped objects itself.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jjforge-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: jjforge, production
  sourceRepos:
    - oci://ghcr.io/nca-apprentices/charts/jjforge
    - https://github.com/nca-apprentices/infra.git
    - https://charts.redpanda.com
    - https://seaweedfs.github.io/seaweedfs/helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jjforge-prod
  clusterResourceWhitelist: []
  # The platform's limits on the namespace, which its own Application applies.
  # A chart that shipped one could lift them.
  namespaceResourceBlacklist:
    - { group: cilium.io, kind: "*" }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: "", kind: LimitRange }
