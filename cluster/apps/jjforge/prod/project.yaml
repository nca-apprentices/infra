# What jjforge-prod's Applications may deploy: its chart and its directory
# here, into its own namespace only. The namespace comes from this directory
# under the platform's project, so the app creates no cluster-scoped objects
# itself. Its stores run under platform/stores.yaml's project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jjforge-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: jjforge, production
  sourceRepos:
    - oci://ghcr.io/nca-apprentices/charts/jjforge
    - https://github.com/nca-apprentices/infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: jjforge-prod
  clusterResourceWhitelist: []
  # The platform's limits on the namespace, which its own Application applies.
  # A chart that shipped one could lift them.
  namespaceResourceBlacklist:
    # A Role or RoleBinding would let the app's pods write the rest of
    # these through the API server themselves.
    - { group: rbac.authorization.k8s.io, kind: "*" }
    - { group: cilium.io, kind: "*" }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: "", kind: LimitRange }
    # An IngressRoute's host is a string in its rule, which the ingress-hosts
    # admission policy can't check. Apps serve through an Ingress instead.
    # The chart creates no Traefik objects, so none may replace no-cookies or
    # the TLS options that check Cloudflare's client certificate.
    - { group: traefik.io, kind: "*" }
    # The secrets Application alone creates SopsSecrets, see
    # cluster/platform/manifests/policies/sops.yaml.
    - { group: isindir.github.com, kind: SopsSecret }
