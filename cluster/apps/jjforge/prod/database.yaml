# The Postgres cluster and its backup. Needs the CNPG operator, the Barman
# Cloud plugin, and storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jjforge-prod-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: jjforge-prod
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: cluster/apps/jjforge/prod/manifests/database
  destination:
    server: https://kubernetes.default.svc
    namespace: jjforge-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
