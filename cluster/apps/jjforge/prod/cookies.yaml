# Removes the Cookie header, so the public jjforge never sees a cookie that
# another part of the domain set. A compromised server could otherwise take
# over the session of any member who opens it.
# The chart's Ingress names it in ingress.middlewares, see application.yaml.
# A sign-in cookie of jjforge's own needs a middleware that keeps it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: no-cookies
  namespace: jjforge-prod
spec:
  headers:
    customRequestHeaders:
      Cookie: ""
