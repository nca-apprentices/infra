# Requests every container gets unless it sets its own, so the quota can count
# them. Prod sets no default limit: its pods run at priority prod, and the node
# evicts dev first under memory pressure.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: jjforge-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 256Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jjforge-prod
  namespace: jjforge-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Prod and dev together stay below the node, 4 CPUs and 8 GB, which
  # also carries the platform.
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
