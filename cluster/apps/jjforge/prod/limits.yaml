# What a container gets when it sets nothing. Memory is requested and
# limited alike, so a pod can only die of its own limit, never of a
# neighbour's. CPU has no limit: a busy pod slows down instead of dying.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: jjforge-prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      default: { memory: 256Mi }
      defaultRequest: { cpu: 100m, memory: 256Mi }
