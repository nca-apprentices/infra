# The GitHub login in front of the ops portal and the ops tools without one of
# their own, through Argo CD's Dex. Traefik asks it about every request, see
# manifests/ops. The app environments have their own login, see
# oauth2-proxy-apps.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: "10.7.1"
    helm:
      releaseName: oauth2-proxy
      valuesObject:
        config:
          # client-id, client-secret, and cookie-secret. See docs/bootstrap.md.
          existingSecret: oauth2-proxy
          # Answers 202 to a signed-in request, which Traefik then passes on.
          upstreams: ["static://202"]
        resources:
          requests: { cpu: 5m, memory: 16Mi }
          limits: { memory: 128Mi }
        extraArgs:
          # Dex admits members of the organization alone, see
          # cluster/bootstrap/kustomization.yaml.
          provider: oidc
          oidc-issuer-url: https://argocd.nca-apprentices.dev/api/dex
          # The last scope adds the kubernetes client to the ID token's
          # audience, so the API server accepts it. Traefik passes it to
          # Headlamp alone, as the Authorization header that this sets.
          scope: openid profile email groups audience:server:client_id:kubernetes
          set-authorization-header: "true"
          set-xauthrequest: "true"
          # Each tool's host signs in on its own: a redirect URL without a host
          # returns to the host that asked, see manifests/ops/ops-login.yaml.
          # Dex lists each host's callback.
          redirect-url: /oauth2/callback
          reverse-proxy: "true"
          skip-provider-button: "true"
          # The cookie covers one tool's host alone, so no app ever receives it.
          # The name differs from the apps login's, so neither reads the
          # other's cookie.
          cookie-name: _ops_login
          # GitHub membership is checked at sign-in only, so a removed member
          # keeps access until the cookie expires: half a day, not the default
          # week, as long as the ID token in it lasts.
          cookie-expire: 12h
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Every pod here passes the restricted level, so a new one must too.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
