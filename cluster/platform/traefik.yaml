apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "41.6.0"
    helm:
      releaseName: traefik
      valuesObject:
        # One line per request in VictoriaLogs. ClientHost is Cloudflare's
        # address, and request_Cf-Connecting-Ip the client's.
        accessLog:
          enabled: true
          format: json
          fields: { headers: { names: { Cf-Connecting-Ip: keep } } }
        # Every prod app depends on the ingress, so no app may evict it.
        priorityClassName: system-cluster-critical
        # One Traefik per node, bound to the node's ports 80 and 443. Plain
        # Hetzner servers hand out no LoadBalancer addresses, and giving the
        # Service the node's own IP makes Cilium drop every other port on it,
        # the Kubernetes and Talos APIs included.
        deployment: { kind: DaemonSet }
        service: { spec: { type: ClusterIP } }
        # A host port can't be held twice, so the old pod goes first.
        updateStrategy: { rollingUpdate: { maxUnavailable: 1, maxSurge: 0 } }
        ports:
          # Open to the internet for ACME alone, so its requests leave no
          # log line: whatever scans port 80 creates no data.
          web: { hostPort: 80, observability: { accessLogs: false } }
          websecure:
            hostPort: 443
            # An Ingress that names no entry point serves on 443 only. Port 80
            # carries nothing but Let's Encrypt's HTTP-01 challenges, whose
            # solver names it explicitly.
            asDefault: true
            # Every request comes through Cloudflare, so the client's address
            # is in X-Forwarded-For. Traefik keeps the header from these
            # addresses alone, from https://www.cloudflare.com/ips/. Cloudflare
            # speaks HTTP/3 to visitors, so the node doesn't.
            forwardedHeaders:
              trustedIPs:
                - 173.245.48.0/20
                - 103.21.244.0/22
                - 103.22.200.0/22
                - 103.31.4.0/22
                - 141.101.64.0/18
                - 108.162.192.0/18
                - 190.93.240.0/20
                - 188.114.96.0/20
                - 197.234.240.0/22
                - 198.41.128.0/17
                - 162.158.0.0/15
                - 104.16.0.0/13
                - 104.24.0.0/14
                - 172.64.0.0/13
                - 131.0.72.0/22
                - 2400:cb00::/32
                - 2606:4700::/32
                - 2803:f800::/32
                - 2405:b500::/32
                - 2405:8100::/32
                - 2a06:98c0::/29
                - 2c0f:f248::/32
            # gRPC and HTTP share :443 and are separated by ALPN, so the client
            # needs no second hostname or port.
            http:
              tls: { enabled: true }
        providers:
          kubernetesIngress:
            enabled: true
            # The Service is a ClusterIP and has no address to publish, so
            # Ingresses report the domain instead and count as healthy.
            publishedService: { enabled: false }
            ingressEndpoint: { hostname: nca-apprentices.dev }
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Traefik binds the node's ports 80 and 443, which baseline forbids.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
