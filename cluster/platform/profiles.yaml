# Pyroscope, as one binary. ebpf-collector.yaml writes every pod's CPU
# profiles to it, and Grafana reads them. A profile is expendable and lives 7
# days, so nothing backs it up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: profiles
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: pyroscope
    targetRevision: "2.3.1"
    helm:
      releaseName: profiles
      valuesObject:
        # The chart's own Alloy scrapes pods by annotation. The eBPF
        # collector replaces it.
        alloy: { enabled: false }
        pyroscope:
          # The Service is profiles:4040, which the collector and Grafana name.
          fullnameOverride: profiles
          extraArgs: { log.level: info }
          structuredConfig:
            limits: { retention_period: 7d }
          persistence: { enabled: true, storageClassName: local-data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Shares the observability namespace with the other stores, so it sets
    # the same level.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
