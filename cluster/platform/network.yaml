# The network policies of every environment that has network/values.yaml, such
# as ../apps/ncaleague/prod/network/values.yaml, from the chart in
# charts/network. They run under the platform's project, since the app
# projects may not create network policies.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: network
  namespace: argocd
  annotations:
    # With the apps: each needs its environment's namespace.
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A removed values file, or a generator that briefly finds none, deletes
  # the Application but none of what it deployed.
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    - git:
        repoURL: https://github.com/nca-apprentices/infra.git
        revision: main
        files:
          - path: cluster/apps/*/*/network/values.yaml
  template:
    metadata:
      name: "{{ index .path.segments 2 }}-{{ index .path.segments 3 }}-network"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/nca-apprentices/infra.git
          targetRevision: main
          path: cluster/platform/charts/network
          helm:
            releaseName: network
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
        - repoURL: https://github.com/nca-apprentices/infra.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 2 }}-{{ index .path.segments 3 }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
