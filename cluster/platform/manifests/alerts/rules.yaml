# A backup that stops without anyone noticing is the usual way a restore
# fails, and with auto-sync a failed sync is just as quiet.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: nca
  namespace: observability
spec:
  groups:
    - name: backup
      rules:
        - alert: BackupJobStale
          expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".+-backup"}) > 26 * 3600
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.cronjob }} hasn't succeeded for more than a day."
        - alert: BackupMirrorDown
          expr: kube_deployment_status_replicas_available{deployment=~".+-backup"} < 1
          for: 15m
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} isn't running."
        - alert: WalArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} can't archive WAL."
        # WAL replays from the last base backup, so a stalled ScheduledBackup
        # makes every restore slower and, after the retention, impossible.
        - alert: BaseBackupStale
          expr: time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 26 * 3600
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has no base backup from the last day."
    - name: ingress
      rules:
        - alert: OriginWithoutClientCert
          expr: probe_success{check="origin-client-cert"} == 1
          for: 5m
          annotations:
            summary: Traefik answers HTTPS without Cloudflare's client certificate, so any Cloudflare account reaches the node. Check TLSOption default and the origin-pull-ca Secret in traefik.
        - alert: OriginClientCertProbeMissing
          expr: absent(probe_success{check="origin-client-cert"})
          for: 30m
          annotations:
            summary: Nothing checks that Traefik requires Cloudflare's client certificate.
    - name: argocd
      rules:
        - alert: ArgoAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          annotations:
            summary: "Application {{ $labels.name }} is {{ $labels.sync_status }}."
        - alert: ArgoAppUnhealthy
          expr: argocd_app_info{health_status!="Healthy"} == 1
          for: 15m
          annotations:
            summary: "Application {{ $labels.name }} is {{ $labels.health_status }}."
    # The general TargetDown alert covers a workload that stops answering
    # scrapes. These catch the ones that answer but fail.
    - name: workloads
      rules:
        - alert: JjforgeServerErrors
          expr: sum by (namespace) (rate(http_server_requests_seconds_count{job="observability/jjforge", outcome="SERVER_ERROR"}[5m])) / sum by (namespace) (rate(http_server_requests_seconds_count{job="observability/jjforge"}[5m])) > 0.05
          for: 10m
          annotations:
            summary: "More than 5% of the requests to {{ $labels.namespace }} fail with a server error."
        # A store that refuses what the Collector sends loses it, since the
        # app has already moved on.
        - alert: TelemetryExportFailing
          expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_.+", job="observability/telemetry"}[5m])) > 0
          for: 15m
          annotations:
            summary: "The OpenTelemetry Collector fails to send through {{ $labels.exporter }}."
        - alert: TraefikServerErrors
          expr: sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
          for: 10m
          annotations:
            summary: "More than 5% of the requests to {{ $labels.service }} fail with a server error."
        - alert: TraefikConfigRejected
          expr: traefik_config_last_reload_success == 0
          for: 15m
          annotations:
            summary: "Traefik rejected its latest configuration and serves the one before."
        - alert: RedpandaPartitionsUnavailable
          expr: redpanda_cluster_unavailable_partitions > 0
          for: 5m
          annotations:
            summary: "{{ $value }} Redpanda partitions in {{ $labels.namespace }} have no leader."
        # The volume server holds a fixed number of volumes, see the
        # environment's stores/seaweedfs.yaml. A bucket that can't get a volume
        # fails every write.
        - alert: SeaweedfsVolumesRunningOut
          expr: sum by (namespace, pod) (SeaweedFS_volumeServer_volumes{type="volume"}) / on (namespace, pod) SeaweedFS_volumeServer_max_volumes > 0.8
          for: 15m
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} uses more than 80% of its volumes."
        # A pod that waits an hour won't start without help: the node lacks
        # the memory it requests, its image fails, or it crashes in a loop.
        # It may also block a rollout or hold requests others need.
        - alert: PodStuck
          expr: >-
            max by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1
            or max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason!~"ContainerCreating|PodInitializing"}) == 1
          for: 1h
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} hasn't started for an hour."
    # Let's Encrypt certificates last 90 days and cert-manager renews them
    # with 30 days left. Under 21 means renewal has failed for 9 days.
    - name: certificates
      rules:
        - alert: CertificateExpiring
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 86400
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} expires in less than 21 days."
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 1h
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} isn't ready."
