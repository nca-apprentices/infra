# The data disk from talconfig.yaml, exposed as a StorageClass. Everything
# stateful in the cluster lands here. The disk is in plain text until a
# rebuild applies the encryption that talconfig.yaml asks for.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-data
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  nodePath: /var/mnt/data
---
# The same disk for data that goes with its claim, such as a preview's
# database. Under Retain, each closed preview left its volume on the disk.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-scratch
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  nodePath: /var/mnt/data
