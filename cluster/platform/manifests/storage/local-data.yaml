# The data disk from talconfig.yaml, exposed as a StorageClass. Everything
# stateful in the cluster lands here. The disk is in plain text until a
# rebuild applies the encryption that talconfig.yaml asks for.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-data
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  nodePath: /var/mnt/data
