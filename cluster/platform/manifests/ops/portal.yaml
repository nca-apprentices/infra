# Traefik picks a certificate by the name the browser asks for, from all it
# has loaded, so every route on the host below serves this one.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ops-tls
  namespace: ops
spec:
  secretName: ops-tls
  dnsNames: [ops.nca-apprentices.dev]
  issuerRef: { kind: ClusterIssuer, name: letsencrypt }
---
# Asks oauth2-proxy about every request. A visitor without a session goes to
# GitHub and comes back to the page they asked for. Traefik can't reference a
# middleware in another namespace, so each namespace with a route holds a copy.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-login
  namespace: ops
spec:
  forwardAuth:
    address: http://oauth2-proxy.ops.svc.cluster.local/
    trustForwardHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal
  namespace: ops
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`ops.nca-apprentices.dev`) && PathPrefix(`/oauth2/`)
      services: [{ name: oauth2-proxy, port: 80 }]
    # GitHub returns here from the apps login, see oauth2-proxy-apps.yaml.
    - kind: Rule
      match: Host(`ops.nca-apprentices.dev`) && PathPrefix(`/apps-oauth2/`)
      services: [{ name: oauth2-proxy-apps, port: 80 }]
    - kind: Rule
      match: Host(`ops.nca-apprentices.dev`)
      middlewares: [{ name: github-login }]
      services: [{ name: portal, port: 80 }]
  tls: { secretName: ops-tls }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal
  namespace: ops
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nca ops</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5b6470; --line: #dde1e6; --accent: #2563eb; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1216; --card: #171b21; --text: #e6e9ed; --muted: #9aa3ae; --line: #2a3038; --accent: #6ea0ff; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 64rem; margin: 0 auto; padding: 3rem 1rem; }
      h1 { margin: 0; font-size: 1.75rem; }
      h2 { margin: 2.5rem 0 .75rem; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: .75rem; margin: 0; padding: 0; list-style: none; }
      a { display: block; height: 100%; padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: .6rem; color: inherit; text-decoration: none; }
      a:hover, a:focus-visible { border-color: var(--accent); }
      strong { display: block; color: var(--accent); }
      span { font-size: .9rem; }
      code { font-size: .85em; }
      small { display: block; margin-top: .5rem; color: var(--muted); font-size: .8rem; }
    </style>
    <main>
      <h1>nca ops</h1>
      <h2>Cluster</h2>
      <ul>
        <!-- Starts the Argo CD login, which GitHub completes without a click. -->
        <li><a href="/argocd/auth/login?return_url=https%3A%2F%2Fops.nca-apprentices.dev%2Fargocd%2Fapplications"><strong>Argo CD</strong><span>Deploys the cluster from the <code>nca-apprentices/infra</code> repository on GitHub and shows whether each app matches it.</span><small>admins: everything. dev: syncs jjforge-dev and ncaleague-dev and sets their images. Others: read.</small></a></li>
        <li><a href="/grafana/"><strong>Grafana</strong><span>Dashboards of the metrics. Explore queries metrics, logs, and profiles.</span><small>admins: edit. Others: view and Explore.</small></a></li>
        <li><a href="/logs/select/vmui/"><strong>VictoriaLogs</strong><span>Searches the logs of every pod.</span><small>Everyone: search.</small></a></li>
        <li><a href="/headlamp/"><strong>Headlamp</strong><span>Shows the Kubernetes objects in the cluster.</span><small>Everyone: read, except Secrets.</small></a></li>
      </ul>
      <h2>jjforge-dev</h2>
      <ul>
        <li><a href="/jjforge-dev/redpanda/"><strong>Redpanda Console</strong><span>Topics, messages, and consumer groups of the dev Redpanda.</span><small>Everyone: read, write, and delete.</small></a></li>
        <li><a href="/jjforge-dev/seaweedfs/"><strong>SeaweedFS</strong><span>Buckets, files, and S3 users of the dev SeaweedFS.</span><small>Everyone: read, write, and delete.</small></a></li>
      </ul>
    </main>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: ops
spec:
  selector:
    matchLabels: { app: portal }
  template:
    metadata:
      labels: { app: portal }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.5-alpine-slim
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: html
          configMap: { name: portal }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: ops
spec:
  selector: { app: portal }
  ports: [{ port: 80, targetPort: 8080 }]
