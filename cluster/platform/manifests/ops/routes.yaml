# Each tool has a host of its own, so a flaw in one tool's pages can't act
# with a member's session in another, such as Argo CD's. Argo CD and Grafana
# sign in with GitHub themselves, so they need no github-login middleware, and
# the argocd CLI keeps working.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`argocd.nca-apprentices.dev`)
      services: [{ name: argocd-server, port: 80 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`grafana.nca-apprentices.dev`)
      services: [{ name: observability-grafana, port: 80 }]
---
# VictoriaLogs has no login, and outside /select/ it writes, deletes, and
# detaches partitions. Only the read-only /select/ part is routed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: logs
  namespace: observability
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`logs.nca-apprentices.dev`) && PathPrefix(`/select/`)
      middlewares: [{ name: github-login }]
      services: [{ name: logs-victoria-logs-single-server, port: 9428 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-login
  namespace: observability
spec:
  forwardAuth:
    address: http://oauth2-proxy.ops.svc.cluster.local/
    trustForwardHeader: false
---
# Headlamp signs each person in to the Kubernetes API with GitHub, see
# platform/headlamp.yaml. Only Traefik, after the ops login, reaches it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`headlamp.nca-apprentices.dev`)
      middlewares: [{ name: github-login }]
      services: [{ name: headlamp, port: 80 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-login
  namespace: headlamp
spec:
  forwardAuth:
    address: http://oauth2-proxy.ops.svc.cluster.local/
    trustForwardHeader: false
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-only
  namespace: headlamp
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
---
# Hubble shows every flow in the cluster. No pod reaches Relay. A
# port-forward enters the pod's own network namespace, so it still works.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hubble-relay
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels: { k8s-app: hubble-relay }
  ingress: [{}]
---
# The jjforge-dev stores' UIs have no login of their own, see stores/ in
# apps/jjforge/dev. They are ops tools, so the ops login guards them, not the
# apps login of jjforge-dev's own hosts.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stores
  namespace: jjforge-dev
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`redpanda-dev.nca-apprentices.dev`)
      middlewares: [{ name: ops-login }]
      services: [{ name: redpanda-console, port: 8080 }]
    - kind: Rule
      match: Host(`seaweedfs-dev.nca-apprentices.dev`)
      middlewares: [{ name: ops-login }]
      services: [{ name: seaweedfs-admin, port: 23646 }]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ops-login
  namespace: jjforge-dev
spec:
  forwardAuth:
    address: http://oauth2-proxy.ops.svc.cluster.local/
    trustForwardHeader: false
