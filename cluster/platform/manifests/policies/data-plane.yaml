# The data plane is reachable from namespaces labeled nca/data-plane and from
# nothing else. An app opts in through that label on its namespace. A
# compromised CI runner should not be one curl away from the object store.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: data-plane-from-apps-only
  namespace: storage
spec:
  endpointSelector: {}
  ingress:
    # The storage components talk to each other.
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.nca/data-plane: "true"
