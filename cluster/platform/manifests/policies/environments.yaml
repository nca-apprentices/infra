# The network chart's policies, see platform/charts/network, open each app
# environment's traffic. Their Application syncs apart from the app's, so in a
# new environment the app's pods could start first and reach anything. This
# policy denies all traffic of a namespace labeled nca-apprentices.dev/environment
# until the chart's policies allow it, and adds nothing once they do.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: environments-default-deny
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.cilium.k8s.namespace.labels.nca-apprentices.dev/environment
        operator: Exists
  ingress: [{}]
  egress: [{}]
