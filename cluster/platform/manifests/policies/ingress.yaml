# An app's Ingress serves only its own hosts, so a chart or a Helm parameter
# can't take over another app's or the ops portal's host. The same check stops
# cert-manager's challenge Ingress, so no namespace gets a certificate for a
# host it doesn't own. The hosts follow from the namespace:
#
#   jjforge-prod   jjforge.nca-apprentices.dev
#   jjforge-dev    jjforge-dev.nca-apprentices.dev
#   jjforge-pr-12  jjforge-pr-12.nca-apprentices.dev
#
# A rule without a host, or a default backend, would serve every host. The ops
# namespace serves the portal and is exempt. IngressRoutes have no field to
# check, so the app projects forbid them.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ingress-hosts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [ingresses]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [ops]
  variables:
    - name: ns
      expression: namespaceObject.metadata.name
    - name: hosts
      expression: >-
        variables.ns.endsWith('-prod')
        ? '^' + variables.ns.substring(0, size(variables.ns) - 5) + r'\.nca-apprentices\.dev$'
        : variables.ns.endsWith('-dev') || variables.ns.matches('-pr-[0-9]+$')
        ? '^' + variables.ns + r'\.nca-apprentices\.dev$'
        : '^$'
  validations:
    - expression: variables.hosts != '^$'
      messageExpression: >-
        'Only app namespaces, named <app>-prod, <app>-dev, or
        <app>-pr-<number>, hold Ingresses, not ' + variables.ns + '.'
    - expression: "!has(object.spec.defaultBackend)"
      message: A default backend serves every host. Name the host in a rule.
    - expression: >-
        object.spec.?rules.orValue([]).all(r, r.?host.orValue('').matches(variables.hosts))
        && object.spec.?tls.orValue([]).all(t, t.?hosts.orValue([]).all(h, h.matches(variables.hosts)))
      messageExpression: >-
        'Every host of an Ingress in ' + variables.ns + ' must match ' +
        variables.hosts + '.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ingress-hosts
spec:
  policyName: ingress-hosts
  validationActions: [Deny]
