# VictoriaMetrics and VictoriaLogs take writes and deletes, Alertmanager takes
# silences, and github-alerts opens GitHub issues, all without a login. Only
# the namespace itself, Traefik with the GitHub login in front, and the API
# server's webhook calls reach them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: isolate
  namespace: observability
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
    - fromEntities: [kube-apiserver]
