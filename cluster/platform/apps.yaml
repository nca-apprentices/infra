# One Application per directory in ../apps/<app>, one level down, named
# app-<app>-<dir>. The directory is an environment, such as jjforge/prod, or a
# part every environment shares, such as jjforge/ci. Each directory holds its
# namespace, its AppProject, and its own Applications, so adding an app or an
# environment touches nothing outside that directory.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
  annotations:
    # After the platform: apps need the operators, storage, and ingress.
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A removed directory, or a generator that briefly finds none, deletes
  # the Application but none of what it deployed.
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    - git:
        repoURL: https://github.com/nca-apprentices/infra.git
        revision: main
        directories:
          - path: cluster/apps/*/*
  template:
    metadata:
      name: "app-{{ index .path.segments 2 }}-{{ .path.basename }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/nca-apprentices/infra.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      # Server-side apply, like every other Application. Argo CD diffs on the
      # server, and a field removed from git that client-side apply wrote
      # shows no difference there, so it would never leave the cluster.
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
  # In dev, Helm parameters set in the Argo CD UI stay, so a different image
  # deploys without a release. Git keeps the chart version and values. Every
  # other directory patches nothing.
  templatePatch: |
    {{- if eq .path.basename "dev" }}
    spec:
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jqPathExpressions: [.spec.source.helm.parameters]
      syncPolicy:
        syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    {{- else }}
    {}
    {{- end }}
