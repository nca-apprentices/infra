apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redpanda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.redpanda.com
    chart: redpanda
    targetRevision: "5.10.5"
    helm:
      releaseName: redpanda
      valuesObject:
        statefulset: { replicas: 1 }
        # Sized for a shared 8 GB node. The chart default reserves 2.5 GB and
        # pins cores it does not have here.
        resources:
          cpu: { cores: 1, overprovisioned: true }
          memory: { container: { max: 1.5Gi } }
        storage: { persistentVolume: { storageClass: local-data, size: 50Gi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
