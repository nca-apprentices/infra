# Approves the kubelet's requests for a serving certificate from the cluster
# CA, which Talos asks for with rotate-server-certificates, see
# talos/talconfig.yaml. metrics-server then verifies the kubelet like any other
# server, instead of trusting whatever certificate it shows.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-serving-cert-approver
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    # Before metrics-server, which needs the certificates it approves.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/alex1989hu/kubelet-serving-cert-approver.git
    # The commit and image digest of a release, not its tag, since the
    # approver signs off kubelet certificates cluster-wide and a moved tag
    # would change what runs. Renovate updates both, see .github/renovate.json.
    targetRevision: f72897c68e38185aeca848952d10a094054642ba # v0.12.1
    path: deploy/standalone
    kustomize:
      images:
        - ghcr.io/alex1989hu/kubelet-serving-cert-approver@sha256:445a8e5584f659701092d2ec8b625da8929dc75fe4d45274333bd9fe6db8fb75 # 0.12.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kubelet-serving-cert-approver
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
