apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-k8s-stack
    targetRevision: "0.62.0"
    helm:
      releaseName: observability
      valuesObject:
        # The logs from the logs Application, next to the metrics.
        grafana:
          enabled: true
          plugins: [victoriametrics-logs-datasource]
          # Served at ops.nca-apprentices.dev/grafana. Members of the GitHub
          # organization sign in, the admins team as Admin and everyone else
          # as Viewer. Viewers may use Explore, which searches the logs.
          # Grafana skips its login page and goes to GitHub, which returns
          # at once to anyone signed in to the ops portal.
          envValueFrom:
            GF_AUTH_GITHUB_CLIENT_ID:
              secretKeyRef: { name: grafana-github, key: clientID }
            GF_AUTH_GITHUB_CLIENT_SECRET:
              secretKeyRef: { name: grafana-github, key: clientSecret }
          grafana.ini:
            server:
              domain: ops.nca-apprentices.dev
              root_url: https://ops.nca-apprentices.dev/grafana/
              serve_from_sub_path: true
            auth:
              disable_login_form: true
            auth.github:
              enabled: true
              auto_login: true
              scopes: user:email,read:org
              allowed_organizations: nca-apprentices
              allow_sign_up: true
              role_attribute_path: contains(groups[*], '@nca-apprentices/admins') && 'Admin' || 'Viewer'
            users:
              viewers_can_edit: true
        defaultDatasources:
          extra:
            - name: VictoriaLogs
              type: victoriametrics-logs-datasource
              access: proxy
              url: http://logs-victoria-logs-single-server.observability.svc:9428
        # The default prefix, observability-victoria-metrics-k8s-stack, made
        # names and labels longer than the 63 characters Kubernetes allows.
        fullnameOverride: metrics
        # Talos serves controller manager, scheduler, and etcd metrics on
        # localhost only, so none of these targets is reachable.
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeEtcd: { enabled: false }
        # The chart generates a new webhook CA on every render, and the running
        # operator keeps serving the old certificate, so every VictoriaMetrics
        # object fails to apply. cert-manager issues it once instead.
        victoria-metrics-operator:
          admissionWebhooks: { certManager: { enabled: true } }
        # Every alert goes to GitHub, see manifests/alerts/github.yaml, except
        # the always-firing Watchdog and the info alerts.
        alertmanager:
          config:
            route:
              receiver: blackhole
              group_by: [alertname]
              routes:
                - matchers: ['severity!~"info|none"']
                  receiver: github
            receivers:
              - name: blackhole
              - name: github
                webhook_configs:
                  - url: http://github-alerts.observability.svc/v1/receiver
                    send_resolved: true
        vmsingle:
          spec:
            retentionPeriod: "90d"
            # On the encrypted data disk. The cluster has no default class.
            storage: { storageClassName: local-data }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # The node exporter reads the host's network, processes, and files.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
