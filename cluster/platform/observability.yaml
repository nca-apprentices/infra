apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-k8s-stack
    targetRevision: "0.95.0"
    helm:
      releaseName: observability
      valuesObject:
        # The logs from the logs Application, next to the metrics.
        grafana:
          enabled: true
          plugins: [victoriametrics-logs-datasource]
          resources:
            requests: { cpu: 20m, memory: 160Mi }
            limits: { memory: 512Mi }
          sidecar:
            resources:
              requests: { cpu: 5m, memory: 96Mi }
              limits: { memory: 256Mi }
          # Served at grafana.nca-apprentices.dev. Members of the GitHub
          # organization sign in, the admins team as Admin and everyone else
          # as Viewer. Viewers may use Explore, which searches the logs.
          # Grafana skips its login page and goes to GitHub, which returns
          # at once to anyone signed in to GitHub.
          envValueFrom:
            GF_AUTH_GITHUB_CLIENT_ID:
              secretKeyRef: { name: grafana-github, key: clientID }
            GF_AUTH_GITHUB_CLIENT_SECRET:
              secretKeyRef: { name: grafana-github, key: clientSecret }
          grafana.ini:
            server:
              domain: grafana.nca-apprentices.dev
              root_url: https://grafana.nca-apprentices.dev/
              serve_from_sub_path: false
            auth:
              disable_login_form: true
            auth.github:
              enabled: true
              auto_login: true
              scopes: user:email,read:org
              allowed_organizations: nca-apprentices
              allow_sign_up: true
              role_attribute_path: contains(groups[*], '@nca-apprentices/admins') && 'Admin' || 'Viewer'
            users:
              viewers_can_edit: true
        # A log line's trace_id links to its trace. The $$ escapes Grafana's
        # environment variables in provisioning.
        defaultDatasources:
          extra:
            - name: VictoriaLogs
              uid: victorialogs
              type: victoriametrics-logs-datasource
              access: proxy
              url: http://logs-victoria-logs-single-server.observability.svc:9428
              jsonData:
                derivedFields:
                  - name: trace_id
                    matcherType: label
                    matcherRegex: trace_id
                    url: "$${__value.raw}"
                    urlDisplayLabel: View trace
                    datasourceUid: victoriatraces
            # VictoriaTraces through its Jaeger API, see traces.yaml.
            - name: VictoriaTraces
              uid: victoriatraces
              type: jaeger
              access: proxy
              url: http://traces.observability.svc:10428/select/jaeger
        # The default prefix, observability-victoria-metrics-k8s-stack, made
        # names and labels longer than the 63 characters Kubernetes allows.
        fullnameOverride: metrics
        # Talos serves controller manager, scheduler, and etcd metrics on
        # localhost only, so none of these targets is reachable.
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeEtcd: { enabled: false }
        # The node exporter reads the host's network, processes, and files, so
        # it runs in node-agents, see manifests/policies/node-agents.yaml.
        prometheus-node-exporter:
          namespaceOverride: node-agents
          vmScrape:
            spec: { namespaceSelector: { matchNames: [node-agents] } }
        # The chart generates a new webhook CA on every render, and the running
        # operator keeps serving the old certificate, so every VictoriaMetrics
        # object fails to apply. cert-manager issues it once instead.
        victoria-metrics-operator:
          admissionWebhooks: { certManager: { enabled: true } }
        # Every alert goes to GitHub, see manifests/alerts/github.yaml, except
        # the always-firing Watchdog and the info alerts. Watchdog goes to the
        # status page every minute instead, which shows the alert pipeline
        # down when it stops, see nca-apprentices/status. A failing receiver
        # stops Watchdog too, since its own alert would go to GitHub through
        # that same receiver.
        alertmanager:
          spec:
            # Mounted at /etc/vm/secrets/<name>/.
            secrets: [status-heartbeat]
          config:
            route:
              receiver: blackhole
              group_by: [alertname]
              routes:
                - matchers: ['alertname="Watchdog"']
                  receiver: status
                  group_wait: 0s
                  group_interval: 1m
                  repeat_interval: 1m
                - matchers: ['severity!~"info|none"']
                  receiver: github
            receivers:
              - name: blackhole
              - name: github
                webhook_configs:
                  - url: http://github-alerts.observability.svc/v1/receiver
                    send_resolved: true
              - name: status
                webhook_configs:
                  - url: https://status.nca-apprentices.dev/heartbeat/alerts
                    send_resolved: false
                    http_config:
                      authorization:
                        credentials_file: /etc/vm/secrets/status-heartbeat/token
            inhibit_rules:
              - source_matchers: ['alertname="AlertmanagerFailedToSendAlerts"']
                target_matchers: ['alertname="Watchdog"']
        vmsingle:
          spec:
            retentionPeriod: "90d"
            # The alerts read from it, so no app may evict it.
            priorityClassName: system-cluster-critical
            # Memory requested and limited alike, so only its own limit can
            # end the store. Taking in a day of history at once, as a merge
            # does, ran it out of 1Gi.
            resources:
              requests: { cpu: 200m, memory: 2Gi }
              limits: { memory: 2Gi }
            # Metrics that arrive over OTLP get the names a scrape gives them,
            # such as http_server_request_duration_seconds.
            extraArgs:
              opentelemetry.usePrometheusNaming: "true"
              # Samples with the same timestamp merge into one, so a restore
              # that merges a backup in, see docs/operations.md, may be run
              # again without doubling what it already copied.
              dedup.minScrapeInterval: 1ms
              # A merge sends a day of samples in one request, above the
              # default of 32 MB.
              maxInsertRequestSize: 256MB
            # On the data disk. The cluster has no default class.
            storage: { storageClassName: local-data }
            # An empty volume, as on a new node, takes the last nightly backup
            # first, at disk speed, so the store serves its history before it
            # collects anything. vmrestore syncs the directory to the backup,
            # which is why it runs only when nothing is there.
            initContainers:
              - name: restore
                image: victoriametrics/vmrestore:v1.153.0@sha256:f5f2adfbad3e7ec0552636bfb8a60d1c1ad76ad544c03f0f73fae561da648f8e
                command: [sh, -c]
                args:
                  - |
                    if [ -n "$(ls -A /victoria-metrics-data)" ]; then
                      echo "data present, nothing to restore"
                      exit 0
                    fi
                    vmrestore -src=s3://nca-backup-metrics/latest \
                      -customS3Endpoint=https://fsn1.your-objectstorage.com \
                      -storageDataPath=/victoria-metrics-data
                envFrom: [{ secretRef: { name: metrics-backup-s3 } }]
                resources:
                  {
                    requests: { cpu: 100m, memory: 128Mi },
                    limits: { memory: 512Mi },
                  }
                volumeMounts:
                  [{ name: data, mountPath: /victoria-metrics-data }]
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Nothing here touches the host. The node exporter runs in node-agents.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
