apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-k8s-stack
    targetRevision: "0.62.0"
    helm:
      releaseName: observability
      valuesObject:
        # The logs from the logs Application, next to the metrics.
        grafana:
          enabled: true
          plugins: [victoriametrics-logs-datasource]
        defaultDatasources:
          extra:
            - name: VictoriaLogs
              type: victoriametrics-logs-datasource
              access: proxy
              url: http://logs-victoria-logs-single-server.observability.svc:9428
        # Talos serves controller manager and scheduler metrics on localhost
        # only, so neither target is reachable. The controller manager's
        # Service name is also 64 characters, one over the limit.
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        vmsingle:
          spec:
            retentionPeriod: "90d"
            # On the encrypted data disk. The cluster has no default class.
            storage: { storageClassName: local-data }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # The node exporter reads the host's network, processes, and files.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
