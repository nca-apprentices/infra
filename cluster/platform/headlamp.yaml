apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: "0.45.0"
    helm:
      releaseName: headlamp
      valuesObject:
        # Served at headlamp.nca-apprentices.dev behind the GitHub login in
        # manifests/ops. Everyone who passes it acts as Headlamp's own account,
        # which reads everything except Secrets.
        config:
          baseURL: ""
          unsafeUseServiceAccountToken: true
        clusterRoleBinding: { clusterRoleName: view }
        ingress: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
