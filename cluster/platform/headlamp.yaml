apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: "0.45.0"
    helm:
      releaseName: headlamp
      valuesObject:
        # Served at headlamp.nca-apprentices.dev behind the GitHub login in
        # manifests/ops. Each person then signs in to the Kubernetes API with
        # GitHub through Argo CD's Dex, as kubectl does, so Headlamp acts with
        # their own roles and the audit log names them, see
        # platform/manifests/access. The client is public, with PKCE.
        config:
          baseURL: ""
          unsafeUseServiceAccountToken: false
          oidc:
            clientID: kubernetes
            issuerURL: https://argocd.nca-apprentices.dev/api/dex
            scopes: profile,email,groups
            callbackURL: https://headlamp.nca-apprentices.dev/oidc-callback
            usePKCE: true
        # Headlamp's own account needs no roles any more.
        clusterRoleBinding: { create: false, clusterRoleName: view }
        ingress: { enabled: false }
        # The restricted Pod Security level, on top of the chart's non-root
        # user.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
        resources:
          requests: { cpu: 5m, memory: 32Mi }
          limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Every pod here passes the restricted level, so a new one must too.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
