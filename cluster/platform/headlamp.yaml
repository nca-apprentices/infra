apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: "0.45.0"
    helm:
      releaseName: headlamp
      valuesObject:
        # Served at headlamp.nca-apprentices.dev behind the ops login in
        # manifests/ops, which signs the person in through Argo CD's Dex.
        # Traefik passes the login's ID token as the Authorization header,
        # which Headlamp sends on to the Kubernetes API, so Headlamp acts with
        # their own roles and the audit log names them, see
        # platform/manifests/access. The X-Auth-Request headers name them in
        # the UI, which skips Headlamp's own login.
        config:
          baseURL: ""
          unsafeUseServiceAccountToken: false
          extraArgs:
            - -proxy-auth=true
            - -proxy-auth-username-header=X-Auth-Request-Preferred-Username
            - -proxy-auth-email-header=X-Auth-Request-Email
            - -proxy-auth-group-header=X-Auth-Request-Groups
        # Headlamp's own account needs no roles any more.
        clusterRoleBinding: { create: false, clusterRoleName: view }
        ingress: { enabled: false }
        # The restricted Pod Security level, on top of the chart's non-root
        # user.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
        resources:
          requests: { cpu: 5m, memory: 32Mi }
          limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Every pod here passes the restricted level, so a new one must too.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
