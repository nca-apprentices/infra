# The GitHub login, for members of nca-apprentices only, as in jjforge-dev.
# Traefik sets X-Forwarded-Host from the request itself, so a client can't
# name another host for the login to return to.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: github-login
spec:
  forwardAuth:
    address: http://oauth2-proxy-apps.ops.svc.cluster.local/
    trustForwardHeader: false
---
# Removes the Cookie header after github-login has checked it, so the PR's
# code never reads a member's session.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: no-cookies
spec:
  headers:
    customRequestHeaders:
      Cookie: ""
