{{- if .Values.backup }}
{{- $name := .Values.name }}
# The Hetzner bucket that tofu/backup.tf creates for this database. Backups and
# WAL that no restore to a point in the last 30 days needs are deleted.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $name }}-db
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://nca-backup-{{ .Release.Namespace }}-db/
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: {{ $name }}-backup-s3
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: {{ $name }}-backup-s3
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: {{ $name }}-backup-s3
        key: AWS_REGION
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $name }}-db-nightly
spec:
  schedule: "0 0 3 * * *"
  # A base backup right after creation, so a new cluster is restorable before
  # its first night. WAL alone restores nothing.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ $name }}-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
