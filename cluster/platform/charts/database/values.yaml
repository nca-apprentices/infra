# The app, which names the database, its owner role, and the cluster,
# <name>-db.
name: ""
# The volume on the data disk.
size: 1Gi
# Postgres settings beyond the defaults, such as max_connections.
parameters: {}
resources: {}
priorityClassName: ""
# False lets Argo CD delete the cluster, with its data, when the Application
# drops it, as a preview's does.
keep: true
# Production: continuous WAL archiving and a nightly base backup to the
# bucket nca-backup-<namespace>-db, with the key in <name>-backup-s3.
backup: false
# Which life of this cluster this is, counted from 0. A cluster lost with its
# volume, as in a node move, comes back as the next generation: it restores
# from the backups of the one before, the last base backup and every WAL
# segment after it, and archives under a name of its own, <name>-db-<n>,
# because Barman refuses to write into another cluster's history.
generation: 0
