# ops.nca-apprentices.dev: Argo CD, Grafana, Headlamp, the logs, and
# the jjforge-dev stores under one host, each behind a GitHub login.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops
  namespace: argocd
  annotations:
    # After the tools it routes to and the login in front of them.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: cluster/platform/manifests/ops
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
