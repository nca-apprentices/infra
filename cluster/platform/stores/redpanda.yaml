# What every environment's Redpanda shares. See ../redpanda.yaml.
# Sized for a shared 8 GB node. The chart default reserves 2.5 GB and pins
# cores it does not have here. Each environment sets its cores and memory.
resources:
  cpu: { overprovisioned: true }
# Pod Security restricted. Every container runs as Redpanda's user 101, the
# sidecar and init containers included.
statefulset:
  replicas: 1
  podTemplate:
    spec:
      securityContext: &pod
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: redpanda-configurator
          securityContext: &container
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
        - { name: bootstrap-yaml-envsubst, securityContext: *container }
      containers:
        - { name: redpanda, securityContext: *container }
        # The sidecar requests near the 43 MiB it uses. The namespace default
        # of 256 MiB doesn't fit the node twice over.
        - name: sidecar
          securityContext: *container
          resources: { requests: { cpu: 10m, memory: 64Mi } }
# The Argo CD sync waits for this one-off Job, which must fit beside the rest.
post_install_job:
  podTemplate:
    spec:
      securityContext: *pod
      initContainers:
        - { name: bootstrap-yaml-envsubst, securityContext: *container }
      containers:
        - name: post-install
          securityContext: *container
          resources: { requests: { cpu: 10m, memory: 64Mi } }
# Clients run in the cluster. The external listener would open NodePorts on
# the node, the unauthenticated admin API among them.
external: { enabled: false }
# No route leads to the console, and rpk in the broker pod does its job.
console: { enabled: false }
storage: { persistentVolume: { storageClass: local-data } }
# The tuning container runs privileged, which the namespace's Pod Security
# level forbids. Redpanda runs without it, with fewer concurrent disk requests.
tuning: { tune_aio_events: false }
