# What every environment's SeaweedFS shares. See ../seaweedfs.yaml.
#
# The AppProjects admit no cluster-scoped objects, and no SeaweedFS component
# uses the ClusterRole.
global: { seaweedfs: { createClusterRole: false } }
# Pod Security restricted. The chart starts weed itself, past the image's
# entrypoint that drops root, so the pods run as the image's seaweed user.
# The chown init containers hand it the data that root wrote before, and go
# once every environment has synced.
podSecurity: &pod
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile: { type: RuntimeDefault }
containerSecurity: &container
  enabled: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
# Data on the encrypted data disk, logs in the pod. The chart's default host
# paths are forbidden by Pod Security baseline and would bypass the
# encryption. Requests sit near use without traffic: 25 MiB for the master
# and the volume server, 92 MiB for the filer. Each environment sets the
# volume server's disk.
master:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 64Mi } }
  data: { type: persistentVolumeClaim, size: 1Gi, storageClass: local-data }
  logs: { type: emptyDir }
  podSecurityContext: *pod
  containerSecurityContext: *container
  initContainers: |
    - name: chown
      image: chrislusf/seaweedfs:4.47
      command: [chown, -R, "1000:1000", /data]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE] }
      # Without a request it takes the namespace default of 256 MiB, which
      # becomes the pod's request and no longer fits on the node.
      resources: { requests: { cpu: 10m, memory: 16Mi } }
      volumeMounts: [{ name: "data-{{ .Release.Namespace }}", mountPath: /data }]
volume:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 64Mi } }
  podSecurityContext: *pod
  containerSecurityContext: *container
  initContainers: |
    - name: chown
      image: chrislusf/seaweedfs:4.47
      command: [chown, -R, "1000:1000", /data]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE] }
      # Without a request it takes the namespace default of 256 MiB, which
      # becomes the pod's request and no longer fits on the node.
      resources: { requests: { cpu: 10m, memory: 16Mi } }
      volumeMounts: [{ name: data, mountPath: /data }]
filer:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 128Mi } }
  podSecurityContext: *pod
  containerSecurityContext: *container
  initContainers: |
    - name: chown
      image: chrislusf/seaweedfs:4.47
      command: [chown, -R, "1000:1000", /data]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE] }
      # Without a request it takes the namespace default of 256 MiB, which
      # becomes the pod's request and no longer fits on the node.
      resources: { requests: { cpu: 10m, memory: 16Mi } }
      volumeMounts: [{ name: data-filer, mountPath: /data }]
  # Every S3 request needs a key from the identities in the environment's
  # seaweedfs-s3-config secret, which also limit each identity to its own
  # bucket.
  s3:
    {
      enabled: true,
      enableAuth: true,
      existingConfigSecret: seaweedfs-s3-config,
    }
  data: { type: persistentVolumeClaim, size: 5Gi, storageClass: local-data }
  logs: { type: emptyDir }
admin:
  podSecurityContext: *pod
  containerSecurityContext: *container
