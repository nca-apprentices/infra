# The GitHub login in front of every app environment but the public prod ones.
# Traefik asks it about every request, see the github-login Middleware of each
# app environment. It has its own OAuth 2.0 app and cookie secret, so an app
# that reads its cookie can't sign in to the ops portal with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy-apps
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: "10.7.0"
    helm:
      releaseName: oauth2-proxy-apps
      valuesObject:
        config:
          # client-id, client-secret, and cookie-secret. See docs/bootstrap.md.
          existingSecret: oauth2-proxy-apps
          # Answers 202 to a signed-in request, which Traefik then passes on.
          upstreams: ["static://202"]
        extraArgs:
          provider: github
          github-org: nca-apprentices
          # Each app host signs in on its own: GitHub returns to the host's
          # /apps-oauth2/callback, see manifests/ops/apps-login.yaml, and the
          # cookie covers that host alone. A public prod app never receives
          # it, so it can't replay a member's session into dev or a preview.
          # The GitHub OAuth app's callback is https://nca-apprentices.dev/apps-oauth2
          # with wildcard matching, so it admits every host's callback.
          proxy-prefix: /apps-oauth2
          reverse-proxy: "true"
          skip-provider-button: "true"
          # jjforge also removes the cookie before the app, see
          # apps/jjforge/*/cookies.yaml, since a preview runs a branch's code.
          cookie-name: _apps_login
          whitelist-domain: .nca-apprentices.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
