# Serves the metrics.k8s.io API that Headlamp and kubectl top read.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: "3.14.0"
    helm:
      releaseName: metrics-server
      valuesObject:
        # The kubelet serves a certificate from the cluster CA, see
        # kubelet-serving-cert-approver.yaml, so metrics-server verifies it.
        # An empty list, not a removed key, so root's apply drops the old flag.
        args: []
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
