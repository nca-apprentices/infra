apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.20.1"
    helm:
      releaseName: cert-manager
      valuesObject:
        crds: { enabled: true }
        # Renews every app's certificate, so no app may evict it.
        global: { priorityClassName: system-cluster-critical }
        # A deleted Certificate takes its secret along, so a closed preview
        # leaves no TLS secret behind.
        enableCertificateOwnerRef: true
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { memory: 256Mi }
        webhook:
          resources:
            requests: { cpu: 5m, memory: 32Mi }
            limits: { memory: 128Mi }
        cainjector:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # Every pod here passes the restricted level, so a new one must too.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
