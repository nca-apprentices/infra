# Ships every container's logs to VictoriaLogs in logs.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logs-collector
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-logs-collector
    targetRevision: "0.3.7"
    helm:
      releaseName: logs-collector
      valuesObject:
        remoteWrite:
          - url: http://logs-victoria-logs-single-server.observability:9428
        # Traefik's access log has no message field of its own, so its
        # entries show the request path instead of "missing _msg field".
        collector: { msgField: [message, msg, log, RequestPath] }
  # The collector reads container logs from host paths, so it runs in
  # node-agents, see manifests/policies/node-agents.yaml.
  destination:
    server: https://kubernetes.default.svc
    namespace: node-agents
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
