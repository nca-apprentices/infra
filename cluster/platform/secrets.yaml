# Every SopsSecret under secrets/, each into the namespace it names. The
# bootstrap applies secrets/bootstrap/ instead, and creates the namespaces
# before Argo CD starts, since most belong to Applications of later waves.
# Only this Application may create a SopsSecret, see
# manifests/policies/sops.yaml.
#
# No deletion finalizer: deleting this Application would delete every
# SopsSecret, and with each the Secret it owns.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    # After the operator and its CRD, before everything that reads a secret.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: secrets
    directory:
      recurse: true
      exclude: "bootstrap/*"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    # A SopsSecret for a new environment fails until the environment's
    # Application creates the namespace.
    retry:
      limit: 5
      backoff: { duration: 1m, factor: 2, maxDuration: 10m }
