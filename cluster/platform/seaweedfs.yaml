# One SeaweedFS per environment that has stores/seaweedfs.yaml, such as
# ../apps/jjforge/prod/stores/seaweedfs.yaml, named <app>-<env>-seaweedfs. It
# runs in the environment's namespace under the environment's AppProject.
# stores/seaweedfs.yaml here holds the values every environment shares, and the
# environment's file holds what differs.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    # With the apps: each needs its environment's namespace and AppProject.
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A removed directory, or a generator that briefly finds none, deletes
  # the Application but none of what it deployed.
  syncPolicy: { preserveResourcesOnDeletion: true }
  generators:
    - git:
        repoURL: https://github.com/nca-apprentices/infra.git
        revision: main
        files:
          - path: cluster/apps/*/*/stores/seaweedfs.yaml
  template:
    metadata:
      name: "{{ index .path.segments 2 }}-{{ index .path.segments 3 }}-seaweedfs"
    spec:
      project: "{{ index .path.segments 2 }}-{{ index .path.segments 3 }}"
      sources:
        - repoURL: https://seaweedfs.github.io/seaweedfs/helm
          chart: seaweedfs
          targetRevision: "4.47.0"
          helm:
            releaseName: seaweedfs
            valueFiles:
              - $values/cluster/platform/stores/seaweedfs.yaml
              - "$values/{{ .path.path }}/seaweedfs.yaml"
        - repoURL: https://github.com/nca-apprentices/infra.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 2 }}-{{ index .path.segments 3 }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [ServerSideApply=true]
