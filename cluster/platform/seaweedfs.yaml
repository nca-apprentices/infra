apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: "4.47.0"
    helm:
      releaseName: seaweedfs
      valuesObject:
        # Data on the encrypted data disk, logs in the pod. The chart's
        # default host paths are forbidden by Pod Security baseline and would
        # bypass the encryption.
        master:
          replicas: 1
          data:
            { type: persistentVolumeClaim, size: 1Gi, storageClass: local-data }
          logs: { type: emptyDir }
        volume:
          replicas: 1
          dataDirs:
            - name: data
              type: persistentVolumeClaim
              size: 40Gi
              storageClass: local-data
        filer:
          replicas: 1
          s3: { enabled: true }
          data:
            { type: persistentVolumeClaim, size: 5Gi, storageClass: local-data }
          logs: { type: emptyDir }
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
