apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: "4.47.0"
    helm:
      releaseName: seaweedfs
      valuesObject:
        # Data on the encrypted data disk, logs in the pod. The chart's
        # default host paths are forbidden by Pod Security baseline and would
        # bypass the encryption.
        master:
          replicas: 1
          data:
            { type: persistentVolumeClaim, size: 1Gi, storageClass: local-data }
          logs: { type: emptyDir }
          # A new bucket claims copy_1 volumes up front, 7 by default, which
          # one small node can't spare per bucket.
          config: |-
            [master.volume_growth]
            copy_1 = 2
        volume:
          replicas: 1
          dataDirs:
            - name: data
              type: persistentVolumeClaim
              size: 40Gi
              storageClass: local-data
              # 1 GB volumes (master volumeSizeLimitMB) on a 40 GB disk. The
              # chart's fallback of 7 left no room for a second bucket.
              maxVolumes: 38
        filer:
          replicas: 1
          # Every S3 request needs a key from the identities in
          # secrets/platform/seaweedfs-s3-config.enc.yaml, which also limit
          # each app to its own bucket.
          s3:
            {
              enabled: true,
              enableAuth: true,
              existingConfigSecret: seaweedfs-s3-config,
            }
          data:
            { type: persistentVolumeClaim, size: 5Gi, storageClass: local-data }
          logs: { type: emptyDir }
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
