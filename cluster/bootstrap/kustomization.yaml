# The only imperative step in the whole instance: install Argo CD, then hand it
# the root application and never touch the cluster by hand again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.2/manifests/install.yaml
  - root.yaml

# Sync waves order the child Applications only if Argo CD can tell when a child
# is healthy, which it stopped doing by default in 1.8.
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
  # Server-side diff compares with what the API server would store, so fields
  # that webhooks and defaults fill in don't show as drift under server-side
  # apply. The timeout ends a sync that waits for health forever: a child that
  # only a newer commit can fix otherwise blocks root from ever syncing it.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        controller.diff.server.side: "true"
        controller.sync.timeout.seconds: "900"
  # Served at ops.nca-apprentices.dev/argocd over plain HTTP behind Traefik,
  # which ends TLS. Members of the GitHub organization sign in through the
  # bundled Dex. The admin password is off, and kubectl stays the fallback.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        server.rootpath: /argocd
        server.basehref: /argocd
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: https://ops.nca-apprentices.dev/argocd
        admin.enabled: "false"
        dex.config: |
          connectors:
            - type: github
              id: github
              name: GitHub
              config:
                clientID: $argocd-github:clientID
                clientSecret: $argocd-github:clientSecret
                orgs:
                  - name: nca-apprentices
                teamNameField: slug
  # The admins team runs Argo CD. The dev team also syncs each app's dev
  # environment and sets its Helm parameters, which is how another image
  # reaches dev. Every other member of the organization only reads.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        policy.default: role:readonly
        scopes: "[groups]"
        policy.csv: |
          g, nca-apprentices:admins, role:admin
          g, nca-apprentices:dev, role:dev
          p, role:dev, applications, sync, jjforge-dev/*, allow
          p, role:dev, applications, update, jjforge-dev/*, allow
          p, role:dev, applications, sync, ncaleague-dev/*, allow
          p, role:dev, applications, update, ncaleague-dev/*, allow
