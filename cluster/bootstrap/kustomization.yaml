# The only imperative step in the whole instance: install Argo CD, then hand it
# the root application and never touch the cluster by hand again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.2/manifests/install.yaml
  - root.yaml

# Sync waves order the child Applications only if Argo CD can tell when a child
# is healthy, which it stopped doing by default in 1.8.
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs
        # The operator reports each SopsSecret in one status message. Anything
        # but Healthy or suspended is an error, and the Secret keeps its last
        # good data. The secrets Application turns Degraded, which alerts.
        resource.customizations.health.isindir.github.com_SopsSecret: |
          hs = { status = "Progressing", message = "Waiting for the operator" }
          if obj.status ~= nil and obj.status.message ~= nil then
            hs.message = obj.status.message
            if obj.status.message == "Healthy" then
              hs.status = "Healthy"
            elseif obj.status.message == "Reconciliation is suspended" then
              hs.status = "Suspended"
            else
              hs.status = "Degraded"
            end
          end
          return hs
  # Server-side diff compares with what the API server would store, so fields
  # that webhooks and defaults fill in don't show as drift under server-side
  # apply. The timeout ends a sync that waits for health forever: a child that
  # only a newer commit can fix otherwise blocks root from ever syncing it.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        controller.diff.server.side: "true"
        controller.sync.timeout.seconds: "900"
  # Served at argocd.nca-apprentices.dev over plain HTTP behind Traefik, which
  # ends TLS. A host of its own keeps the other ops tools' pages out of its
  # origin, so a flaw in one of them can't act with an admin's Argo CD session.
  # Members of the GitHub organization sign in through the bundled Dex. The
  # admin password is off, and kubectl stays the fallback. The root path stays
  # set, so applying this file replaces the old /argocd.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        server.rootpath: ""
        server.basehref: /
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: https://argocd.nca-apprentices.dev
        admin.enabled: "false"
        dex.config: |
          connectors:
            - type: github
              id: github
              name: GitHub
              config:
                clientID: $argocd-github:clientID
                clientSecret: $argocd-github:clientSecret
                orgs:
                  - name: nca-apprentices
                teamNameField: slug
  # Each synced revision of an Application becomes a GitHub deployment in the
  # repository it comes from, in an environment named after the Application
  # without the app- prefix, such as jjforge-prod or jjforge-pr-12:
  #
  #   jjforge-prod      chart 0.2.4      jjforge, tag v0.2.4
  #   jjforge-pr-12     chart from git   jjforge, the PR's head commit
  #   app-jjforge-prod  infra directory  infra, the synced commit
  #
  # A chart from GHCR names its repository by its name. The deployment turns
  # inactive when the Application is deleted. An Application opts in with the
  # annotation notifications.argoproj.io/subscribe.deployment.github: "".
  # The infra-repo GitHub App writes them, with argocd-notifications-secret.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-notifications-cm
      data:
        context: |
          argocdUrl: https://argocd.nca-apprentices.dev
        service.github: |
          appID: $github-appID
          installationID: $github-installationID
          privateKey: $github-privateKey
        trigger.deployment: |
          - description: The synced revision runs and is healthy
            when: app.status.operationState != nil and app.status.operationState.phase == 'Succeeded' and app.status.health.status == 'Healthy'
            oncePer: app.status.operationState.syncResult.revision
            send: [deployment]
          - description: The sync failed, or the revision doesn't become healthy
            when: app.status.operationState != nil and (app.status.operationState.phase in ['Error', 'Failed'] or app.status.health.status == 'Degraded')
            oncePer: app.status.operationState.syncResult.revision
            send: [deployment]
          - description: The Application is being deleted
            when: app.metadata.deletionTimestamp != nil
            send: [deployment]
        template.deployment: |
          message: >-
            {{ if .app.metadata.deletionTimestamp }}Removed{{ else }}Sync
            {{ .app.status.operationState.phase }}, health
            {{ .app.status.health.status }}{{ end }}
          github:
            repoURLPath: https://github.com/nca-apprentices/{{ base .app.spec.source.repoURL | trimSuffix ".git" }}
            revisionPath: >-
              {{ if hasPrefix "oci://" .app.spec.source.repoURL }}v{{ .app.spec.source.targetRevision }}{{ else }}{{ .app.status.operationState.syncResult.revision }}{{ end }}
            deployment:
              state: >-
                {{ if .app.metadata.deletionTimestamp }}inactive{{ else if and (eq .app.status.operationState.phase "Succeeded") (eq .app.status.health.status "Healthy") }}success{{ else }}failure{{ end }}
              environment: '{{ trimPrefix "app-" .app.metadata.name }}'
              environmentURL: >-
                {{ with dig "spec" "source" "helm" "valuesObject" "ingress" "host" "" .app }}https://{{ . }}{{ else }}{{ $.context.argocdUrl }}/applications/argocd/{{ $.app.metadata.name }}{{ end }}
              logURL: "{{ .context.argocdUrl }}/applications/argocd/{{ .app.metadata.name }}"
              requiredContexts: []
              autoMerge: false
  # argocd-notifications-secret comes from secrets/platform/, through the sops
  # operator. Argo CD's manifests ship it empty, and applying them server-side
  # would remove the App's key from it.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-notifications-secret
  # The admins team runs Argo CD. The dev team also syncs each app's dev
  # environment and sets its Helm parameters, which is how another image
  # reaches dev. Every other member of the organization only reads.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-rbac-cm
      data:
        policy.default: role:readonly
        scopes: "[groups]"
        policy.csv: |
          g, nca-apprentices:admins, role:admin
          g, nca-apprentices:dev, role:dev
          p, role:dev, applications, sync, jjforge-dev/*, allow
          p, role:dev, applications, update, jjforge-dev/*, allow
          p, role:dev, applications, sync, ncaleague-dev/*, allow
          p, role:dev, applications, update, ncaleague-dev/*, allow
  # Argo CD deploys every app, so no app may evict it. The class is built in,
  # so it exists before Argo CD creates any of its own.
  - target: { kind: (Deployment|StatefulSet) }
    patch: |-
      - op: add
        path: /spec/template/spec/priorityClassName
        value: system-cluster-critical
