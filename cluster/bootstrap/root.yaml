# App of apps: every file directly in ../platform is a child of this one
# object. The apps ApplicationSet among them adds one child per directory in
# ../apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nca-apprentices/infra.git
    targetRevision: main
    path: cluster/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # A sync the timeout ended starts over, so a slow first install converges
    # without a new commit.
    retry:
      limit: 5
      backoff: { duration: 1m, factor: 2, maxDuration: 10m }
