# App of apps: every file directly in ../platform is a child of this one
# object. The apps ApplicationSet among them adds one child per directory in
# ../apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nca-apprentices/infra.git
    targetRevision: main
    path: cluster/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
