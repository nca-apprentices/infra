# kubectl as yourself: you sign in with GitHub through Argo CD's Dex, and the
# API server knows you as github:<login> with your teams' roles, see
# docs/operations.md#kubectl. The cluster `nca`, with the node's address and
# CA, comes from talos/clusterconfig/kubeconfig, which every operator holds,
# so the address stays out of this public repository.
apiVersion: v1
kind: Config
users:
  - name: github
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://argocd.nca-apprentices.dev/api/dex
          - --oidc-client-id=kubernetes
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=groups
        interactiveMode: IfAvailable
contexts:
  - name: nca
    context: { cluster: nca, user: github }
current-context: nca
