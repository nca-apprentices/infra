# kubectl as yourself: you sign in with GitHub through Argo CD's Dex, and the
# API server knows you as github:<login> with your teams' roles, see
# docs/operations.md#kubectl. The address is the node's, as
# `tofu output node_ipv4` shows it, and its firewall admits the operator
# addresses only. The certificate is the cluster CA's, which is public.
apiVersion: v1
kind: Config
clusters:
  - name: nca
    cluster:
      server: https://23.88.56.69:6443
      certificate-authority-data: 
users:
  - name: github
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://argocd.nca-apprentices.dev/api/dex
          - --oidc-client-id=kubernetes
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=groups
          - --oidc-use-pkce
        interactiveMode: IfAvailable
contexts:
  - name: nca
    context: { cluster: nca, user: github }
current-context: nca
