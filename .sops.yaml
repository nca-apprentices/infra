# Public age keys only. A file is encrypted to each key its rule lists, and
# any one of them decrypts it. The private halves never enter this repo.
#
# To add or remove an operator, change the keys and the rules, then re-encrypt
# every file as docs/bootstrap.md#operators describes.
#
# Run sops from the repository root: it finds this file from the working
# directory, and the path rules below expect paths relative to it.

# The escrow key comes first. It is for recovery only, and its private half
# lives in offline escrow. Then one key per operator, named after its owner.
# The cluster key is sops-secrets-operator's, and its private half lives in
# the cluster, see docs/operations.md#secrets.
keys:
  - &escrow age19dktsaqcp6xdhqwtq4qygk0y5ea5uc8y20dtez4jjua2nv4r0alslxp6s5
  - &kevin-nca age1u8xgtntlm6ynx4lf6xsaeaya8wt5cy3ur2j46k7f5njq6nqpu92s8sf7ht
  - &cluster age1p6j54pjgnjgfw9hv6ephcsasphcv3rdwz7zr9c5980w2j395n3rqyc3z37

# The first rule that matches a path wins. The cluster key decrypts only the
# secrets the cluster holds anyway, never the bootstrap secrets, the cloud
# credentials, or the Talos PKI.
creation_rules:
  # Kubernetes Secrets the bootstrap applies, the cluster's private key among
  # them. Only the values are encrypted, so a diff shows which secret changed.
  - path_regex: secrets/bootstrap/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: [*escrow, *kevin-nca]
  # SopsSecrets, which Argo CD syncs and the operator decrypts.
  - path_regex: secrets/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: [*escrow, *kevin-nca, *cluster]
  # Everything else is encrypted whole: the tofu credentials and the Talos
  # cluster secrets.
  - path_regex: (secrets/.*\.enc\.env|talos/talsecret\.sops\.yaml)$
    age: [*escrow, *kevin-nca]
