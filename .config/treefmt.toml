# `mise run fmt` formats with this file, and `mise run check` checks with it.
excludes = [
  ".terraform.lock.hcl",
  # Encrypted: sops rejects a file whose bytes changed.
  "secrets/**",
  "talos/talsecret.sops.yaml",
  # Vendored unchanged, so an update replaces the whole file.
  "cluster/platform/manifests/storage/local-path-provisioner.yaml",
  # Go templates, which no YAML formatter parses.
  "cluster/platform/charts/*/templates/**",
]

[formatter.tofu]
command = "tofu"
options = ["fmt"]
includes = ["*.tf", "*.tfvars"]

[formatter.shell]
command = "shfmt"
options = ["--write", "--indent=2"]
includes = [".config/mise/tasks/*"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.yaml]
command = "prettier"
options = ["--write"]
includes = ["*.yaml", "*.yml"]

[formatter.markdown]
command = "rumdl"
options = ["fmt"]
includes = ["*.md"]
