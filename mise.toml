# The shared cluster. Run the tasks from the repository root. `mise tasks`
# lists them by group:
#
#   apply:*    change the cloud, the node, or the cluster, or restore data
#   upgrade:*  move the node to the Talos or Kubernetes release in talos/versions.yaml
#   cluster:*  show the cluster's state and Hetzner usage, and reach the node
#   secrets:*  re-encrypt the secrets after a change to .sops.yaml
#   check      validate everything without credentials, as CI does
#   fmt        format every file

# The release the tasks and mise.lock were tested with.
min_version = "2026.10.8"

[settings]
# Records each tool's download URL and checksum per platform in mise.lock.
# CI installs only what the lockfile records.
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[tools]
age = "1.3.2"
# `mise run cluster:usage` reads Object Storage with it.
aws-cli = "2.37.12"
"github:apricote/hcloud-upload-image" = "1.5.0"
helm = "4.3.0"
kubeconform = "0.8.0"
kubectl = "1.36.5"
# kubectl oidc-login, which cluster/kubeconfig.yaml signs in with.
"aqua:int128/kubelogin" = "1.36.4"
# `mise run cluster:usage` reads the Hetzner API with it.
jq = "1.8.2"
kustomize = "5.8.2"
opentofu = "1.13.1"
sops = "3.13.3"
# Follows talos in talos/versions.yaml.
talosctl = "1.14.2"
yq = "4.54.1"
# `mise run check` lints the workflows and scans the history for secrets.
actionlint = "1.7.12"
gitleaks = "8.30.1"
zizmor = "1.30.1"
# `mise run fmt` formats every file. `mise run check` checks the formatting
# and the prose.
"github:numtide/treefmt" = "2.6.0"
rumdl = "0.2.78"
shfmt = "3.14.1"
taplo = "0.10.0"
vale = "3.24.0"
dprint = "0.60.1"

# Tool configuration lives under .config. mise finds its tasks in
# .config/mise/tasks without help, and rumdl finds .config/rumdl.toml.
[env]
TREEFMT_CONFIG = "{{config_root}}/.config/treefmt.toml"
VALE_CONFIG_PATH = "{{config_root}}/.config/vale/vale.ini"
# Written by `mise run apply:bootstrap`, or by talosctl when an operator is added.
# Every worktree uses the main checkout's copy, so a new one reaches the
# cluster too.
KUBECONFIG = "{{ exec(command='git rev-parse --path-format=absolute --git-common-dir') }}/../talos/clusterconfig/kubeconfig"
# Written by `mise run talos:talosconfig`, next to the kubeconfig. An operator's
# own TALOSCONFIG, as docs/bootstrap.md sets it up, takes precedence.
TALOSCONFIG = { default = "{{ exec(command='git rev-parse --path-format=absolute --git-common-dir') }}/../talos/clusterconfig/talosconfig" }
