# The shared cluster. Run the tasks from the repository root:
# `mise run image`, `mise run apply` and `mise run bootstrap`, each optionally
# followed by an environment name. `mise run check` is what CI runs.
[tools]
age = "1.3.2"
"github:apricote/hcloud-upload-image" = "1.5.0"
helm = "4.3.0"
kubeconform = "0.8.0"
kubectl = "1.35.8"
kustomize = "5.8.1"
opentofu = "1.12.6"
sops = "3.13.3"
talhelper = "3.1.17"
# Follows talosVersion in talos/talconfig.yaml.
talosctl = "1.12.2"
yq = "4.53.6"
# `mise run fmt` formats every file. `mise run check` checks the formatting
# and the prose.
"github:numtide/treefmt" = "2.6.0"
rumdl = "0.2.73"
shfmt = "3.13.1"
taplo = "0.10.0"
vale = "3.21.0"
"npm:prettier" = "3.8.1"

# Tool configuration lives under .config. mise finds its tasks in
# .config/mise/tasks without help, and rumdl finds .config/rumdl.toml.
[env]
TREEFMT_CONFIG = "{{config_root}}/.config/treefmt.toml"
VALE_CONFIG_PATH = "{{config_root}}/.config/vale/vale.ini"
# Written by `mise run bootstrap`, or by talosctl when an operator is added.
KUBECONFIG = "{{config_root}}/talos/clusterconfig/kubeconfig"
