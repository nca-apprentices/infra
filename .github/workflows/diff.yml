name: Argo CD diff

# Comments on every PR how each Application's rendered manifests change. A
# throwaway Argo CD in kind renders base and head from the public repo and
# charts, so the job holds no secrets.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false
      # The chart version installs the Argo CD that cluster/bootstrap/ pins.
      # The image gets the Docker socket, which is root on the runner, so it
      # is pinned by digest and runs in a job without a write token.
      - name: Render the diff
        run: |
          docker run --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/base:/base-branch" \
            -v "$PWD/head:/target-branch" \
            -v "$PWD/output:/output" \
            -e REPO=${{ github.repository }} \
            -e TARGET_BRANCH=refs/pull/${{ github.event.number }}/merge \
            -e ARGOCD_CHART_VERSION=9.4.9 \
            -e MAX_DIFF_LENGTH=65000 \
            dagandersen/argocd-diff-preview:v0.2.15@sha256:01c4712f945f9183ef1eacbaf5974ced42624b8bdfc6dab876a07ab89bd0cd83
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff
          path: output/diff.md

  # Fork PRs get a read-only token, so they get no comment.
  comment:
    name: Comment
    needs: [render]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diff
      # One comment per PR, found by its marker and edited on each push.
      - name: Comment the diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          marker='<!-- argocd-diff -->'
          { echo "$marker"; cat diff.md; } >body.md
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" |
            head -n1)
          if [[ -z $id ]]; then
            gh pr comment "$PR" --body-file body.md
            exit
          fi
          gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@body.md >/dev/null
