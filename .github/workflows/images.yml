name: Images

# Builds the images in cluster/platform/images/, which upstream ships for
# amd64 only, for both architectures. A PR only checks that the build works.
# Main pushes the image, and a PR then pins its digest in the manifest that
# runs it.
on:
  push:
    branches: [main]
    paths: [cluster/platform/images/**, .github/workflows/images.yml]
  pull_request:
    paths: [cluster/platform/images/**, .github/workflows/images.yml]

permissions:
  contents: read
  packages: write

jobs:
  receiver:
    name: alertmanager-github-receiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cluster/platform/images/alertmanager-github-receiver
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/alertmanager-github-receiver:v0.11
