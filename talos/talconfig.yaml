# talhelper input. Talos has no shell and no SSH: the machine configuration in
# this file is the entire contract with the operating system, which is what
# makes a node replaceable rather than repairable.
clusterName: nca
talosVersion: v1.12.2
kubernetesVersion: v1.35.1
endpoint: https://10.0.1.2:6443

cniConfig:
  # Cilium is installed by Argo CD, not by Talos.
  name: none

nodes:
  - hostname: nca-1
    ipAddress: 10.0.1.2
    controlPlane: true
    installDisk: /dev/sda
    nodeLabels:
      topology.kubernetes.io/zone: nbg1
    # The Hetzner volume, found by model rather than by device name, so attach
    # order does not matter. Talos mounts it at /var/mnt/data.
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.model == "Volume" && !system_disk
          minSize: 10GiB
        # LUKS2 keyed to the server's ID, so a copy of the disk is unreadable
        # elsewhere. Talos encrypts a volume only when it creates it. Applying
        # this to a node whose volumes exist breaks their mounts, so
        # docs/encrypt-disks.md rebuilds the node instead.
        encryption: &luks
          provider: luks2
          keys:
            - slot: 0
              nodeID: {}
    # The system disk: STATE holds the machine config with the cluster's CA
    # keys, and EPHEMERAL holds etcd and the container images.
    volumes:
      - name: STATE
        encryption: *luks
      - name: EPHEMERAL
        encryption: *luks

controlPlane:
  patches:
    - |-
      cluster:
        # Phase A is a single node, so the control plane is also the worker.
        # Without this nothing schedules and the cluster looks empty.
        allowSchedulingOnControlPlanes: true
        network:
          cni:
            name: none
        proxy:
          # Cilium replaces kube-proxy; running both is a slower way to get the
          # same result.
          disabled: true
    - |-
      machine:
        kubelet:
          extraMounts:
            - destination: /var/mnt/data
              type: bind
              source: /var/mnt/data
              options: [bind, rshared, rw]
