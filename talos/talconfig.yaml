# talhelper input. Talos has no shell and no SSH: the machine configuration in
# this file is the entire contract with the operating system, which is what
# makes a node replaceable rather than repairable.
clusterName: nca
talosVersion: v1.12.2
kubernetesVersion: v1.35.1
endpoint: https://10.0.1.2:6443

cniConfig:
  # Cilium is installed by Argo CD, not by Talos.
  name: none

nodes:
  - hostname: nca-1
    ipAddress: 10.0.1.2
    controlPlane: true
    installDisk: /dev/sda
    nodeLabels:
      topology.kubernetes.io/zone: nbg1
    # The Hetzner volume, found by model rather than by device name, so attach
    # order does not matter. Talos mounts it at /var/mnt/data.
    userVolumes:
      - name: data
        provisioning:
          diskSelector:
            match: disk.model == "Volume" && !system_disk
          minSize: 10GiB

controlPlane:
  patches:
    - |-
      cluster:
        # Phase A is a single node, so the control plane is also the worker.
        # Without this nothing schedules and the cluster looks empty.
        allowSchedulingOnControlPlanes: true
        network:
          cni:
            name: none
        proxy:
          # Cilium replaces kube-proxy; running both is a slower way to get the
          # same result.
          disabled: true
    - |-
      machine:
        kubelet:
          # The kubelet asks the cluster CA for its serving certificate, which
          # kubelet-serving-cert-approver approves, so clients such as
          # metrics-server can verify it.
          extraArgs:
            rotate-server-certificates: true
          extraMounts:
            - destination: /var/mnt/data
              type: bind
              source: /var/mnt/data
              options: [bind, rshared, rw]
    - |-
      cluster:
        apiServer:
          # The audit log goes to the API server's output, which the log
          # collector already ships to VictoriaLogs, instead of a file on the
          # node that nothing reads.
          extraArgs:
            audit-log-path: "-"
            # Members sign in with GitHub through Argo CD's Dex, so the API
            # server and the audit log know each person, as github:<login>
            # with their teams as github:nca-apprentices:<team>. The Talos
            # admin certificate stays as the way in when Dex is down.
            oidc-issuer-url: https://argocd.nca-apprentices.dev/api/dex
            oidc-client-id: kubernetes
            oidc-username-claim: preferred_username
            oidc-username-prefix: "github:"
            oidc-groups-claim: groups
            oidc-groups-prefix: "github:"
          # What people do, and who reads a Secret, without request bodies. The
          # cluster's own components and service accounts would bury that, so
          # they stay out: Argo CD's changes are already commits in this
          # repository.
          auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            omitStages: [RequestReceived]
            rules:
              - level: None
                userGroups: [system:nodes]
              - level: Metadata
                resources: [{ group: "", resources: [secrets] }]
              - level: None
                userGroups: [system:serviceaccounts]
              - level: None
                users:
                  - system:kube-controller-manager
                  - system:kube-scheduler
                  - system:apiserver
                  - system:kube-proxy
              - level: None
                nonResourceURLs:
                  - /healthz*
                  - /livez*
                  - /readyz*
                  - /version
                  - /openapi*
              - level: Metadata
